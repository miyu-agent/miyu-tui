# 终端界面的软件包清单（施工 9-1 上，`docs/blueprint/packages.md`）：核心照它列出这个包、找它的程序和认的页。
[package]
version = "0.0.1"
protocol = [1, 1]
name = { en = "Terminal interface", zh = "终端界面", ja = "ターミナル画面" }
summary = { en = "Chat with the AI, watch what it does and change settings in the terminal", zh = "在终端里和 AI 对话、看 AI 做事、改配置", ja = "ターミナルで会話し、作業の様子を見て、設定を変える" }

[command]
name = "tui"
program = "miyu-tui"
about = { en = "Open the terminal interface", zh = "打开终端界面", ja = "ターミナル画面を開く" }

[ui]
opens = ["config"]

# 第一次打开的引导里「图标」那一步写它（终端蓝图 `docs/blueprint/tui.md`「第一次打开的引导」第 14 条、「图标」第 4 条）。
[settings.icons]
type = "option"
choices = ["nerd", "plain"]
default = "nerd"
applies = "now"
name = { en = "Icons", zh = "图标", ja = "アイコン" }
description = { en = "Which icon set the terminal interface draws: Nerd Font glyphs, or plain characters for fonts without them.", zh = "终端界面用哪一套图标：Nerd Font 的图标，或者没装这种字体时用的普通字符。", ja = "ターミナル画面のアイコン：Nerd Font のアイコンか、そのフォントがない場合の普通の文字か。" }

# 时间线的几个开关（终端蓝图 `docs/blueprint/tui.md`「时间线」第 18、20 条，2026-10-10 项目主人：通用页要能改、是终端自己的）。
# 出厂值同 `resources/timeline.json`；终端连上时读、改了当场照新的画。
[settings.timeline_fold]
type = "bool"
default = true
applies = "now"
name = { en = "Fold the timeline after a reply", zh = "回复完成后折叠时间线", ja = "返答後にタイムラインを折りたたむ" }
description = { en = "Fold the finished steps into one line once the reply is done.", zh = "回复完成后，把这一段的步骤折叠为一行。", ja = "返答が終わったら、その一連のステップを1行に折りたたむ。" }

[settings.timeline_expand_thought]
type = "bool"
default = false
applies = "now"
name = { en = "Expand thoughts", zh = "展开思考", ja = "思考を展開" }
description = { en = "Show thoughts in full instead of a preview.", zh = "思考默认显示全文，不只显示预览。", ja = "思考をプレビューではなく全文で表示する。" }

[settings.timeline_expand_command]
type = "bool"
default = false
applies = "now"
name = { en = "Expand commands", zh = "展开命令", ja = "コマンドを展開" }
description = { en = "Show commands in full instead of a preview.", zh = "命令默认显示全文，不只显示预览。", ja = "コマンドをプレビューではなく全文で表示する。" }

[settings.timeline_expand_edit]
type = "bool"
default = false
applies = "now"
name = { en = "Expand edits", zh = "展开编辑", ja = "編集を展開" }
description = { en = "Show edit diffs in full instead of a preview.", zh = "编辑的差异默认显示全文，不只显示预览。", ja = "編集の差分をプレビューではなく全文で表示する。" }

[settings.timeline_limit_live]
type = "bool"
default = true
applies = "now"
name = { en = "Limit timeline area height", zh = "限制时间线区域高度", ja = "タイムライン領域の高さを制限" }
description = { en = "Show only the latest lines of the running steps.", zh = "进行中的步骤只显示最新的几行。", ja = "実行中のステップは最新の数行だけ表示する。" }

# 吉祥物的两个开关（终端蓝图 `docs/blueprint/tui.md`「后台命令、子代理和侧边栏」第 7 条，2026-10-11 项目主人：搬进配置页）。
# 出厂值同 `resources/layout.json`，都关着（2026-10-26 项目主人：太吃资源；引导里摆姿势的那只照旧画）；人格设了头像的照样画头像，不受这两项管（「空会话的首页」第 10 条）。
[settings.mascot_home]
type = "bool"
default = false
applies = "now"
name = { en = "Show the mascot on the home screen", zh = "首页显示吉祥物", ja = "ホーム画面にマスコットを表示" }
description = { en = "Show the mascot above the input box of an empty session. A persona's avatar shows regardless.", zh = "在空会话的输入框上方显示吉祥物。人格设了头像的照样显示头像。", ja = "空のセッションの入力欄の上にマスコットを表示する。ペルソナのアバターは設定に関わらず表示される。" }

[settings.mascot_sidebar]
type = "bool"
default = false
applies = "now"
name = { en = "Show the mascot in the sidebar", zh = "侧边栏显示吉祥物", ja = "サイドバーにマスコットを表示" }
description = { en = "Show the mascot at the top of the sidebar. A persona's avatar shows regardless.", zh = "在侧边栏顶部显示吉祥物。人格设了头像的照样显示头像。", ja = "サイドバーの上部にマスコットを表示する。ペルソナのアバターは設定に関わらず表示される。" }

# 按键模式（终端蓝图 `docs/blueprint/tui.md`「按键」表「按键模式」那一行，2026-10-21 项目主人）：`vim` 时会话列表、`/model`
# 里 `j`、`k` 挪，`/` 才开始搜；`arrows` 照方向键的用法，打字就搜。配置页排在「通用」页「按键模式」一组；出厂方向键，引导里「你喜欢的操作方式」那一步选。
[settings.keys]
type = "option"
choices = ["arrows", "vim"]
default = "arrows"
applies = "now"
name = { en = "Key mode", zh = "按键模式", ja = "キー操作モード" }
description = { en = "Vim: in the session list and the model list, j and k move and / starts a search. Arrow keys: typing searches right away and the arrow keys move.", zh = "Vim：会话列表、模型列表里 j、k 上下，按 / 才开始搜。方向键：打字直接搜，方向键上下。", ja = "Vim：セッション一覧とモデル一覧で j と k で移動し、/ で検索を始める。矢印キー：入力するとすぐ検索し、矢印キーで移動する。" }

# 新会话不问人格、预设（终端蓝图 `docs/blueprint/tui.md`「新会话：人格、工作区」第 1a 条，2026-10-22 项目主人）：开着时新会话
# 直接用默认的人格、预设（`persona.default`、`preset.default`），不弹框；默认的预设用不了时照旧弹。配置页排在「通用」页「交互」一组。
[settings.skip_pick]
type = "bool"
default = false
applies = "now"
name = { en = "Don't ask for persona and preset in new sessions", zh = "新会话不再询问人格预设", ja = "新しいセッションでペルソナとプリセットを尋ねない" }
description = { en = "New sessions start with the default persona and preset. /persona and /preset still switch.", zh = "新会话直接用默认的人格和预设。之后仍可以用 /persona、/preset 换。", ja = "新しいセッションはデフォルトのペルソナとプリセットで始まる。/persona と /preset で後から切り替えられる。" }

# 换哪一只吉祥物（终端蓝图 `docs/blueprint/tui.md`「吉祥物包」第 3 条，2026-10-11 项目主人）：值是一个吉祥物包的编号，
# 没写的就是内置的；配置页照 `package.list` 列出装了的吉祥物包让选。
[settings.mascot]
type = "name"
applies = "now"
name = { en = "Mascot", zh = "吉祥物", ja = "マスコット" }
description = { en = "Which mascot to show. Leave unset for the built-in one.", zh = "显示哪一只吉祥物；不设置就是内置的。", ja = "表示するマスコット。未設定なら内蔵のもの。" }

# 主题（终端蓝图 `docs/blueprint/tui.md`「主题」第 5 条，2026-10-21 项目主人定）：框线、记号、修饰这些照哪个主题包；值是包的
# 编号，不设就是默认主题（`theme-default`）。配置页照 `package.list` 列装了的主题包。
[settings.look]
type = "name"
applies = "now"
name = { en = "Theme", zh = "主题", ja = "テーマ" }
description = { en = "Which theme package draws the frames, marks and text styles. Leave unset for the default theme.", zh = "框线、记号、字的修饰照哪个主题包；不设置就是默认主题。", ja = "枠線・記号・文字の装飾をどのテーマパッケージで描くか。未設定ならデフォルトテーマ。" }

# 配色方案（终端蓝图 `docs/blueprint/tui.md`「配色方案」第 2 到 6 条，2026-10-13 项目主人定，2026-10-21 从「主题」改名）：配色、明暗、手动选了深浅铺不铺底色。
# 第一次打开的引导里「主题」那一步写前两项；配置页「通用」里一组「主题」，名字照终端的字写。
[settings.theme]
type = "option"
choices = ["persona", "wallpaper", "tokyonight", "terminal"]
default = "tokyonight"
applies = "now"
name = { en = "Colors", zh = "配色", ja = "配色" }
description = { en = "Follow the persona's avatar, follow the desktop wallpaper, Tokyo Night, or the terminal's own colors.", zh = "跟随人格的头像生成、跟随桌面壁纸生成、tokyonight，或者跟着终端自己的配色。", ja = "ペルソナのアバターから作る配色、デスクトップの壁紙から作る配色、Tokyo Night、またはターミナル自身の配色。" }

# 跟随壁纸、终端配色自选的主色（终端蓝图「主题」的「主色」，2026-10-14 项目主人定；终端配色 2026-10-19 起共这一项）：从几个候选里挑，`#rrggbb`；没写的、不在
# 候选里的（换了壁纸）照打分最高的那个。跟随头像的主色存在人格上（`persona.set` 的 `seed`），不在这里。
[settings.theme_seed]
type = "text"
max = 7
applies = "now"
name = { en = "Main color", zh = "主色", ja = "メインカラー" }
description = { en = "The main color the colors are generated from, picked from a few candidates.", zh = "生成配色用的主色，从几个候选里挑。", ja = "配色を作るメインカラー。いくつかの候補から選ぶ。" }

[settings.theme_mode]
type = "option"
choices = ["auto", "dark", "light"]
default = "auto"
applies = "now"
name = { en = "Light or dark", zh = "明暗", ja = "明暗" }
description = { en = "Follow the terminal's background, or always dark or light.", zh = "跟随终端的底色，或者一直用深色、浅色。", ja = "ターミナルの背景に合わせるか、常にダーク／ライト。" }

[settings.theme_background]
type = "bool"
default = true
applies = "now"
name = { en = "Paint the background", zh = "铺底色", ja = "背景を塗る" }
description = { en = "Paint the whole screen in the theme's background.", zh = "整个界面铺主题的底色。", ja = "画面全体をテーマの背景色で塗る。" }
