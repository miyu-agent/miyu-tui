# 三平台 CI（设计 32 第五节，照核心仓库的那一份）：格式、clippy、文档、测试、行数。核心照 Cargo.toml 里 git 依赖钉住的
# 那个提交取，测试读的出厂资源、协议样本也在那份检出里。
name: CI

on:
  push:
    branches: [main, "step/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: 装上 rust-toolchain.toml 钉住的工具链
        run: rustup toolchain install
      - name: 取编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          add-rust-environment-hash-key: false
      - name: 格式
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: 文档
        run: cargo doc --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: 测试
        if: runner.os != 'Windows'
        run: cargo test --locked --no-fail-fast
      # Windows 上伪终端测试靠 ConPTY 转按键，Esc 这类键的时序不稳，每轮冒一条不同的偶发红；只跑单元测试（AGENTS.md）。
      - name: 测试（Windows 只跑单元测试）
        if: runner.os == 'Windows'
        run: cargo test --locked --no-fail-fast --bins
      - name: 行数（每个 .rs 不超过 500 行，测试也算）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          over=$(find src tests -name '*.rs' -print0 | xargs -0 wc -l | awk '$2 != "total" && $1 > 500 {print}')
          if [ -n "$over" ]; then echo "超过 500 行：" && echo "$over" && exit 1; fi

  # 量尺（蓝图 `tui.md`「量尺」，设计 23 的预算；2026-10-15 项目主人定进 CI、超预算就拦、不打倍数）：空闲唤醒、内存、打开长
  # 会话的峰值、热启动到首页输入框。只在 Linux 上量（`/proc`），照发出去的样子用 release 编，一个一个跑，不和别的测试抢核。
  meters:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: 装上 rust-toolchain.toml 钉住的工具链
        run: rustup toolchain install
      - name: 取编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          key: meters
          save-if: ${{ github.ref == 'refs/heads/main' }}
          add-rust-environment-hash-key: false
      - name: 量尺
        run: cargo test --release --locked --test meters -- --ignored --test-threads=1 --nocapture
