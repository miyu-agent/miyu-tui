# 发版（照官方打包模板 miyu-agent/packages 的 pack.yml，写法同 miyu-embed、miyu-render）：推 `v*` 标签（v 加上清单里的
# 版本；本体和 Cargo.toml 写同一个号，同核心、网页、托盘一起发版时的「年.月.这个月第几版」，如 v2026.11.0，核心 VR-1；
# `tests/versions.rs` 守着两处一样）时，终端本体一种系统打一个 `.miyu`，传进这个标签的 Release；软件源每天收一次，收进索引
# 以后 `miyu pkg install tui` 就装得上。
#
# 主题都不另发：默认主题（2026-10-30 项目主人定）和纯 ASCII（todolist 63，2026-11-13 项目主人定）都编进了程序，
# `packages/tui-theme-default` 只当来源和样板，`packaging/pack.sh` 同样不打。
#
# 包里带本仓库的 `LICENSE`（AGPL-3.0-or-later）和第三方许可证清单 `THIRD-PARTY-LICENSES.txt`（`cargo xtask notices` 生成、
# 提交进仓库，CI 查它是最新的）。
name: release

on:
  push:
    tags: ["v*"]

jobs:
  tui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-latest
            target: macos-aarch64
          - os: windows-latest
            target: windows-x86_64
    uses: miyu-agent/packages/.github/workflows/pack.yml@main
    permissions:
      contents: write
    with:
      package: tui
      folder: tui
      target: ${{ matrix.target }}
      runs-on: ${{ matrix.os }}
      build: |
        set -euo pipefail
        rustup toolchain install
        cargo build --release --locked
        exe=""
        if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
        mkdir -p tui/bin
        cp "target/release/miyu-tui$exe" "tui/bin/miyu-tui$exe"
        chmod 755 "tui/bin/miyu-tui$exe"
        cp LICENSE THIRD-PARTY-LICENSES.txt tui/

