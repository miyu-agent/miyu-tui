[package]
name = "miyu-tui"
version = "0.0.1"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "终端界面的演示程序：和后端并行开发，先搭全屏框架和输入框。"

[dependencies]
# 界面上的字和布局的数值住在 resources/ 的 JSON 里，不写死在代码里。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 收尾行上写做完的时刻，要本地时间；仓库别处也用它（crates/miyu-log）。
jiff = "0.2"
# 核心的东西只经门面 miyu-client 拿（设计 32 第二节）：连核心、数据根和缓存目录在哪、给人看的字、协议里的类型
# （工具结果那一句 `Said`、会话编号、模板）。
miyu-client = { git = "https://github.com/miyu-agent/miyu", rev = "dfe403f8bcdb48610fa1a11ecb76ec38838e4bad" }
# 主题「跟随壁纸」找桌面壁纸、matugen 那一份颜色（蓝图「主题」的「跟随壁纸」）：和网页同一个来处，照网页仓库的 git 提交钉住，
# 升级就是改这个 rev。只用标准库，跑系统的命令（awww、gsettings、osascript……）。
miyu-wallpaper = { git = "https://github.com/miyu-agent/miyu-web", rev = "55df88486cf27298494580d00da43f57a1725ea2" }
# 她的回答按 Markdown 画（蓝图 tui.md「她的回答：Markdown」）；旧版用的也是它。
pulldown-cmark = { version = "0.13", default-features = false }
# 编辑、写入的差异按行比：和 crates/miyu-endpoint 用的是同一个。
similar = { version = "2", default-features = false, features = ["text"] }
# 连接是异步的；界面主循环照旧同步，连核心的活在单独的线程里跑一个运行时。
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync"] }
# 全屏界面的框架；按键、鼠标经它转出来的 crossterm 读。
# writer_mut 用来提交已经准备好的完整帧；版本由 Cargo.lock 钉住。
ratatui = { version = "0.30", features = ["unstable-backend-writer"] }
# 读按键的线程照事件流等、没事时一直睡着（`reader.rs`）：给 ratatui 带的那份 crossterm 打开 event-stream，
# 它的事件流是 futures-core 的 `Stream`。
crossterm = { version = "0.29", default-features = false, features = ["event-stream"] }
futures-core = { version = "0.3", default-features = false }
# 字素簇：光标、删除都按用户看到的一个字走，不切开 emoji 和组合字符。
unicode-segmentation = "1"
# 显示宽度：中文占两列。
unicode-width = "0.2"
# 系统通知：kitty 的 OSC 99 里标题、正文要 base64（蓝图 tui.md「系统通知」第 4 条）；ratatui-image 已经拉进来的同一个。
base64 = "0.22"
# 正文里的图（蓝图 tui.md「图片、公式和 mermaid 图」）：问终端认哪种图片协议、一格多少像素，
# kitty、sixel、iTerm2 在进程里编码，切片画露出来的那一截。不要它的半格拼图和 chafa。
# 钉 12.0.0-rc.2：kitty 的虚拟放置从这一版起带占几列几行（c、r），终端照格子缩放，不照像素自己推（蓝图「图片、公式和
# mermaid 图」第 2 条，2026-10-09 项目主人报图盖住正文）。正式版出了换掉。
ratatui-image = { version = "=12.0.0-rc.2", default-features = false, features = ["crossterm"] }
# 读图片文件：常见的四种，加上 bmp 和 grim 截图出的 ppm（两种都是小解码）。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "pnm"] }
# 问终端的底色是深是浅（主题「跟随终端」，蓝图「主题」第 3 条）。
terminal-colorsaurus = "1.0.3"
# 跟随头像的配色：从头像取主色、照 MD3 生成一套（蓝图「主题」第 5 条，照网页的 theme-persona）。
material-colors = { version = "0.5", default-features = false, features = ["std", "quantize"] }
# SVG 栅格化：按要显示的像素数一次渲到位。
resvg = { version = "0.47", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
# 块级公式排成图：RaTeX，纯 Rust，带 KaTeX 字体（旧版用的也是它）。
ratex-parser = "0.1.14"
ratex-layout = "0.1.14"
ratex-types = "0.1.14"
ratex-render = { version = "0.1.14", features = ["embed-fonts"] }

# RaTeX 第一次找中文字体时往 stderr 打字，全屏会被搅乱：那一下把 stderr 临时指到空设备（蓝图「图片、公式和 mermaid 图」第 7 条）；
# Ctrl+Z 挂起时给自己发 SIGTSTP（蓝图「按键」）；启动时问终端 16 色，轮询标准输入等回话（蓝图「主题」第 10 条）。
# 用它的安全接口，演示程序不写 unsafe。crossterm 已经带着它。
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["stdio", "process", "event"] }

# 伪终端里的端到端测试（`tests/pty.rs`，蓝图「守着它的」）：测试进程里起一个照剧本回话的核心（和端点的测试同一套），
# 在伪终端里起真的界面连上去，读屏幕、发按键。只在测试里用。
[dev-dependencies]
miyu-core = { git = "https://github.com/miyu-agent/miyu", rev = "dfe403f8bcdb48610fa1a11ecb76ec38838e4bad" }
miyu-endpoint = { git = "https://github.com/miyu-agent/miyu", rev = "dfe403f8bcdb48610fa1a11ecb76ec38838e4bad" }
miyu-models = { git = "https://github.com/miyu-agent/miyu", rev = "dfe403f8bcdb48610fa1a11ecb76ec38838e4bad" }
miyu-session = { git = "https://github.com/miyu-agent/miyu", rev = "dfe403f8bcdb48610fa1a11ecb76ec38838e4bad", features = ["testkit"] }
# 测试照钉住的那份核心检出读出厂资源、协议样本（设计 32 第四节第 3 条）。
miyu-client = { git = "https://github.com/miyu-agent/miyu", rev = "dfe403f8bcdb48610fa1a11ecb76ec38838e4bad", features = ["testkit"] }
miyu-tool = { git = "https://github.com/miyu-agent/miyu", rev = "dfe403f8bcdb48610fa1a11ecb76ec38838e4bad", features = ["testkit"] }
# 伪终端测试里拼核心、开套接字、读包清单还要这几样（设计 32 第四节第 2 条：先照原样，以后改黑盒）。
miyu-ipc = { git = "https://github.com/miyu-agent/miyu", rev = "dfe403f8bcdb48610fa1a11ecb76ec38838e4bad" }
miyu-kernel = { git = "https://github.com/miyu-agent/miyu", rev = "dfe403f8bcdb48610fa1a11ecb76ec38838e4bad" }
miyu-store = { git = "https://github.com/miyu-agent/miyu", rev = "dfe403f8bcdb48610fa1a11ecb76ec38838e4bad" }
portable-pty = "0.9"
vt100 = "0.16"

# 和仓库工作区的 lints 一样（根目录 Cargo.toml），演示程序也照这套规矩。
[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"

[lints.clippy]
let_underscore_must_use = "deny"
unused_result_ok = "deny"
unwrap_used = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[profile.dev]
opt-level = 1

# 演示程序不进仓库的 workspace，自己单独编，门禁不查它。
[workspace]
